name: Switch build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # soh.o2r (the port's own assets and shader templates) is built by the host tools
  soh-o2r:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev libpng-dev
      - name: Build soh.o2r
        run: |
          cmake -H. -Bbuild-host -GNinja -DSOH_TOOLS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host --target GenerateSohOtr
      - uses: actions/upload-artifact@v7
        with:
          name: soh-o2r
          path: build-host/soh/soh.o2r

  nro:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - name: Prepare toolchain
        run: |
          # portlibs ships tinyxml2 6.0.0, whose header shadows the 11.0.0 that libultraship builds
          dkp-pacman -Rdd --noconfirm switch-tinyxml2
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Release tags are the upstream Shipwright version plus our build number: 9.3.1-1
          upstream=$(sed -n 's/^project(Ship VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            "$upstream"-[0-9]*) ;;
            *) echo "::error::Tag $tag does not match <upstream version>-<build> (upstream is $upstream)"; exit 1 ;;
          esac
          echo "NX_BUILD=${tag#"$upstream"-}" >> "$GITHUB_ENV"
      - name: Build soh.nro
        run: |
          cmake -H. -Bbuild-switch -GNinja -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake -DCMAKE_BUILD_TYPE=Release -DSOH_NX_BUILD="${NX_BUILD}"
          cmake --build build-switch --target soh_nro
      - uses: actions/upload-artifact@v7
        with:
          name: soh-nro
          path: |
            build-switch/soh/soh.nro
            build-switch/soh/soh.elf

  package:
    needs: [soh-o2r, nro]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publishing the release on tag pushes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble SD card layout
        run: |
          mkdir -p pkg/switch/soh
          cp artifacts/soh-nro/soh.nro artifacts/soh-o2r/soh.o2r pkg/switch/soh/
          cp README.md pkg/README.md
          cp tools/switch/nxlink_screens.py pkg/
      - uses: actions/upload-artifact@v7
        with:
          name: Shipwright-NX
          path: pkg
      - uses: actions/upload-artifact@v7
        with:
          name: soh-elf-symbols
          path: artifacts/soh-nro/soh.elf
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          (cd pkg && zip -qr "../Shipwright-NX-$tag.zip" switch)
          (cd artifacts/soh-nro && zip -q "../../Shipwright-NX-$tag-symbols.zip" soh.elf)
          upstream="${tag%-*}"
          cat > notes.md <<EOF
          Ship of Harkinian $upstream for Nintendo Switch, Shipwright-NX build ${tag##*-}.

          **Install:** unpack \`Shipwright-NX-$tag.zip\` to the root of the SD card, then put your \`oot.o2r\`
          (made with the PC version of [SoH $upstream](https://github.com/HarbourMasters/Shipwright/releases/tag/$upstream))
          into \`sdmc:/switch/soh/\`. Start it in full-memory mode (hold R while launching a game).

          \`Shipwright-NX-$tag-symbols.zip\` has \`soh.elf\` for reading crash reports; you don't need it to play.
          EOF
          gh release create "$tag" --title "Shipwright-NX $tag" --notes-file notes.md \
            "Shipwright-NX-$tag.zip" "Shipwright-NX-$tag-symbols.zip"
